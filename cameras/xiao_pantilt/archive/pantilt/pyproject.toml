[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xiao-pantilt-reference"
version = "0.1.0"
description = "Image-referenced pan camera scan reference and deterministic simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
xiao-pantilt-sim = "xiao_pantilt.sim:main"

[tool.setuptools.packages.find]
where = ["software"]
include = ["xiao_pantilt*"]
namespaces = false
